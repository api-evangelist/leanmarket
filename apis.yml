name: LeanMarket
description: >-
  LeanMarket was a mobile advertising technology company headquartered in
  Mountain View, California, that brought real-time bidding (RTB) display
  advertising to small and mid-sized advertisers through a self-serve platform.
  Its pitch was transparency and operator control: advertisers could pull
  reports showing in-depth data on every mobile app and mobile website their
  ads appeared in — in contrast to blind ad networks — and could tweak,
  optimize and scale campaigns themselves through a self-serve interface with
  up-to-the-second reporting, rather than waiting on an account manager to make
  changes. The company went through the Y Combinator Summer 2012 (S12) batch
  and appears on the Andreessen Horowitz investment list, with seed
  participation also reported from Initialized Capital. LeanMarket is defunct
  and operates no live product, developer portal or API today; this profile is
  retained for historical and network completeness.
